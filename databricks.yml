bundle:
  name: fligths

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-87a36043-96d0.cloud.databricks.com

resources:
  pipelines:
    flights_pipeline:
      name: flights_pipeline
      serverless: true
      catalog: workspace
      schema: default
      libraries:
        - glob:
            include: src/transformations/**
      environment:
        environment_version: "5"
        dependencies:
          - pyspark-data-sources==0.1.6